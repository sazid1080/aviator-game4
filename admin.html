<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 মাস্টার অ্যাডমিন - ক্রাশ গেম</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f0f2e 100%);
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1) 0%, transparent 70%);
            animation: bg-glow 10s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes bg-glow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .container { 
            max-width: 900px; 
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .header h1 { 
            font-size: 36px; 
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }
        
        .header p { 
            font-size: 16px; 
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }
        
        .master-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .master-panel {
            background: #1c1f26;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .master-panel:hover {
            border-color: #79c0ff;
            box-shadow: 0 0 30px rgba(121, 192, 255, 0.2);
            transform: translateY(-5px);
        }
        
        .master-panel h2 {
            color: #79c0ff;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #30363d;
            padding-bottom: 15px;
            text-shadow: 0 0 10px rgba(121, 192, 255, 0.2);
        }
        
        .control-section {
            margin-bottom: 20px;
        }
        
        .control-label {
            display: block;
            margin-bottom: 10px;
            color: #8b949e;
            font-weight: bold;
            font-size: 14px;
        }
        
        .control-input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 16px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        
        .control-input:focus {
            outline: none;
            border-color: #79c0ff;
            box-shadow: 0 0 15px rgba(121, 192, 255, 0.3);
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-primary {
            background: #238636;
            color: white;
            box-shadow: 0 3px 10px rgba(35, 134, 54, 0.2);
        }
        
        .btn-primary:hover {
            background: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(35, 134, 54, 0.3);
        }
        
        .display-value {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            margin: 10px 0;
        }
        
        .display-value-large {
            font-size: 32px;
            font-weight: bold;
            color: #79c0ff;
            text-shadow: 0 0 10px rgba(121, 192, 255, 0.2);
        }
        
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .quick-btn {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #30363d;
            color: #c9d1d9;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .quick-btn:hover {
            background: #484f58;
            transform: scale(1.05);
        }
        
        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        
        .message.show {
            display: block;
            animation: slide-in 0.3s ease-out;
        }
        
        @keyframes slide-in {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.success {
            background: rgba(63, 185, 80, 0.1);
            color: #3fb950;
            border: 1px solid #3fb950;
        }
        
        .message.error {
            background: rgba(248, 81, 73, 0.1);
            color: #f85149;
            border: 1px solid #f85149;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #1c1f26;
            border: 1px solid #30363d;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            border-color: #79c0ff;
            box-shadow: 0 0 15px rgba(121, 192, 255, 0.15);
            transform: translateY(-3px);
        }
        
        .stat-label {
            color: #8b949e;
            font-size: 12px;
            margin-bottom: 10px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #79c0ff;
            text-shadow: 0 0 10px rgba(121, 192, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 মাস্টার অ্যাডমিন প্যানেল</h1>
            <p>ক্রাশ গেম ন��য়ন্ত্রণ - সম্পূর্ণ ক্ষমতা</p>
        </div>

        <div id="message" class="message"></div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">💰 প্লেয়ার ব্যালেন্স</div>
                <div class="stat-value" id="currentBalanceDisplay">৳0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">⚡ পরবর্তী ক্রাশ</div>
                <div class="stat-value" id="currentCrashDisplay">1.50x</div>
            </div>
        </div>

        <div class="master-grid">
            <div class="master-panel">
                <h2>💰 প্লেয়ার ব্যালেন্স নিয়ন্ত্রণ</h2>
                
                <div class="display-value">
                    <div class="control-label">বর্তমান ব্যালেন্স</div>
                    <div class="display-value-large" id="balanceDisplay">৳0</div>
                </div>

                <div class="control-section">
                    <label class="control-label">পরিমাণ যোগ করুন (৳)</label>
                    <input type="number" id="addAmount" class="control-input" placeholder="পরিমাণ" min="1">
                    <button class="btn btn-primary" onclick="addBalance()">✅ যোগ করুন</button>
                </div>

                <div class="control-section">
                    <label class="control-label">দ্রুত যোগ করুন</label>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="quickAdd(1000)">+1000</button>
                        <button class="quick-btn" onclick="quickAdd(5000)">+5000</button>
                        <button class="quick-btn" onclick="quickAdd(10000)">+10000</button>
                        <button class="quick-btn" onclick="quickAdd(50000)">+50000</button>
                    </div>
                </div>
            </div>

            <div class="master-panel">
                <h2>⚡ ক্রাশ মাল্টিপ্লায়ার সেট</h2>
                
                <div class="display-value">
                    <div class="control-label">পরবর্তী ক্রাশ মাল্টিপ্লায়ার</div>
                    <div class="display-value-large" id="crashDisplayAdmin">1.50x</div>
                </div>

                <div class="control-section">
                    <label class="control-label">মাল্টিপ্লায়ার (1.01 - 99.99)</label>
                    <input type="number" id="crashInput" class="control-input" value="1.50" min="1.01" max="99.99" step="0.01">
                    <button class="btn btn-primary" onclick="setCrash()">⚙️ সেট করুন</button>
                </div>

                <div class="control-section">
                    <label class="control-label">দ্রুত সেট করুন</label>
                    <div class="quick-buttons">
                        <button class="quick-btn" onclick="quickCrash(1.5)">1.5x</button>
                        <button class="quick-btn" onclick="quickCrash(2.5)">2.5x</button>
                        <button class="quick-btn" onclick="quickCrash(5.0)">5.0x</button>
                        <button class="quick-btn" onclick="quickCrash(10.0)">10x</button>
                    </div>
                </div>

                <button class="btn btn-primary" onclick="randomCrash()" style="margin-top: 10px;">🎲 র‍্যান্ডম সেট</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'playerBalance';
        const CRASH_KEY = 'crashMultiplier';

        function updateAllStats() {
            const balance = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
            const crash = parseFloat(localStorage.getItem(CRASH_KEY)) || 1.5;

            document.getElementById('balanceDisplay').innerText = `৳${balance}`;
            document.getElementById('currentBalanceDisplay').innerText = `৳${balance}`;
            document.getElementById('crashDisplayAdmin').innerText = crash.toFixed(2) + 'x';
            document.getElementById('currentCrashDisplay').innerText = crash.toFixed(2) + 'x';
            document.getElementById('crashInput').value = crash;
        }

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.innerText = msg;
            el.className = `message show ${type}`;
            setTimeout(() => el.className = 'message', 3000);
        }

        window.addBalance = function() {
            const amount = parseFloat(document.getElementById('addAmount').value);
            if (!amount || amount < 1) {
                showMessage('সঠিক পরিমাণ লিখুন!', 'error');
                return;
            }
            let balance = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
            balance += amount;
            localStorage.setItem(STORAGE_KEY, balance);
            document.getElementById('addAmount').value = '';
            showMessage(`✓ ৳${amount} যোগ করা হয়েছে!`, 'success');
            updateAllStats();
        };

        window.quickAdd = function(amount) {
            let balance = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
            balance += amount;
            localStorage.setItem(STORAGE_KEY, balance);
            showMessage(`✓ ৳${amount} যোগ করা হয়েছে!`, 'success');
            updateAllStats();
        };

        window.setCrash = function() {
            const value = parseFloat(document.getElementById('crashInput').value);
            if (value < 1.01 || value > 99.99) {
                showMessage('1.01 থেকে 99.99 এর মধ্যে দিন!', 'error');
                return;
            }
            localStorage.setItem(CRASH_KEY, value);
            showMessage(`✓ ক্রাশ সেট: ${value.toFixed(2)}x`, 'success');
            updateAllStats();
        };

        window.quickCrash = function(value) {
            localStorage.setItem(CRASH_KEY, value);
            showMessage(`✓ ক্রাশ সেট: ${value.toFixed(2)}x`, 'success');
            updateAllStats();
        };

        window.randomCrash = function() {
            const crash = (Math.random() * 98.98 + 1.01).toFixed(2);
            localStorage.setItem(CRASH_KEY, crash);
            showMessage(`✓ র‍্যান্ডম ক্রাশ: ${crash}x`, 'success');
            updateAllStats();
        };

        updateAllStats();
        setInterval(updateAllStats, 500);

        window.addEventListener('storage', updateAllStats);
    </script>
</body>
</html>
